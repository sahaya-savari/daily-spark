<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <!--
      Static, per-route SEO head.

      This app is a client-only SPA: `head()` only reaches the DOM after JS runs,
      so crawlers and link unfurlers that do not execute JS would otherwise see
      one generic head for every URL. `scripts/postbuild.js` replaces everything
      between these markers with the tags for each route.

      The pre-mount cleanup removes all static SEO tags (including `<title>`)
      before React mounts, letting TanStack Router's HeadContent own the live
      head without creating duplicate `<title>` tags.
    -->
    <!--seo:start-->
    <title>Daily Spark | Free Offline Habit Tracker</title>
    <meta data-ssg-seo name="description" content="A free, offline-first habit tracker for Android and the web. Track daily habits, streaks and progress without an account, ads or analytics. Optional encrypted backups." />
    <link data-ssg-seo rel="canonical" href="https://dailyspark.sahayasavari.dev/" />
    <meta data-ssg-seo property="og:type" content="website" />
    <meta data-ssg-seo property="og:title" content="Daily Spark - Show up. Tick it. Keep going." />
    <meta data-ssg-seo property="og:description" content="A free, offline-first habit tracker for Android and the web. Track daily habits, streaks and progress without an account, ads or analytics. Optional encrypted backups." />
    <meta data-ssg-seo property="og:url" content="https://dailyspark.sahayasavari.dev/" />
    <meta data-ssg-seo name="twitter:card" content="summary_large_image" />
    <meta data-ssg-seo name="twitter:title" content="Daily Spark - Show up. Tick it. Keep going." />
    <meta data-ssg-seo name="twitter:description" content="A free, offline-first habit tracker for Android and the web. Track daily habits, streaks and progress without an account, ads or analytics. Optional encrypted backups." />
    <!--seo:end-->

    <script>
      // Run before the app module so React never sees the static duplicates.
      document.querySelectorAll("[data-ssg-seo], head > title").forEach(function (el) {
        el.remove();
      });
    </script>

    <meta name="theme-color" content="#0E0F12" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Daily Spark" />

    <meta property="og:site_name" content="Daily Spark" />
    <meta property="og:image" content="https://dailyspark.sahayasavari.dev/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Daily Spark social card: the app name beside a glowing ember spark mark." />
    <meta name="twitter:image" content="https://dailyspark.sahayasavari.dev/og-image.png" />
    <meta name="twitter:image:alt" content="Daily Spark social card: the app name beside a glowing ember spark mark." />

    <!-- Relative in source; postbuild rewrites these to /daily-spark/... for
         every generated route, matching the hrefs added by __root.tsx. -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./favicon-32x32.png?v=7" type="image/png" sizes="32x32" />
    <link rel="icon" href="./favicon-16x16.png?v=7" type="image/png" sizes="16x16" />
    <link rel="icon" href="./favicon.ico?v=7" sizes="any" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png?v=7" />
    <!--
      Site-level structured data. Route-independent, so it lives here rather than
      in `head()` (React does not hoist plain <script> tags).

      Values must match src/lib/site.ts: `softwareVersion`/`downloadUrl`/`fileSize`
      describe the published APK (SITE.apk), never the site's own version.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Daily Spark",
        "description": "A free, offline-first habit tracker for Android and the web. No Daily Spark account, ads, or analytics. Habit data stays local by default, with optional encrypted exports.",
        "url": "https://dailyspark.sahayasavari.dev/",
        "applicationCategory": "HealthApplication",
        "operatingSystem": "Android",
        "downloadUrl": "__SITE_APK_URL__",
        "softwareVersion": "v1.0.2",
        "fileSize": "__SITE_APK_SIZE_BYTES__",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "author": { "@type": "Organization", "name": "Daily Spark", "url": "https://github.com/sahaya-savari" }
      }
    </script>
  </head>
  <body class="bg-background text-foreground antialiased selection:bg-ember selection:text-white">
    <!--fallback:start--><!--fallback:end-->
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
