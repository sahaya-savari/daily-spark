<!doctype html>
<!--
  Source document for public/og-image.png (1200x630). Not a page of the site.

  Self-contained by design: no external font, image, or stylesheet requests, so
  rendering is reproducible offline and in CI. Fonts fall back to widely
  available families (Georgia for the display face, Consolas/monospace for
  body), which keeps the layout identical across machines.

  Lives outside public/ so it is never copied into dist/ and can never be
  served. Re-render after editing:
    render this file at exactly 1200x630 and save as public/og-image.png
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Daily Spark - social card source</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { width: 1200px; height: 630px; }
      body {
        background: #121214;
        color: #faf7f5;
        font-family: "Mozilla Headline", sans-serif;
        overflow: hidden;
        position: relative;
      }
      .glow {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(720px 520px at 88% 18%, rgba(236, 137, 76, 0.20), transparent 62%),
          radial-gradient(600px 480px at 6% 96%, rgba(191, 114, 69, 0.12), transparent 60%);
      }
      .grid {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(to right, rgba(250, 247, 245, 0.045) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(250, 247, 245, 0.045) 1px, transparent 1px);
        background-size: 60px 60px;
        mask-image: radial-gradient(circle at 50% 45%, #000 10%, transparent 78%);
        -webkit-mask-image: radial-gradient(circle at 50% 45%, #000 10%, transparent 78%);
      }
      .frame {
        position: absolute;
        inset: 28px;
        border: 1px solid rgba(250, 247, 245, 0.10);
        border-radius: 28px;
      }
      .card {
        position: relative;
        height: 100%;
        padding: 72px 76px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      .top { display: flex; align-items: center; gap: 18px; }
      .badge {
        width: 64px;
        height: 64px;
        border-radius: 16px;
        background: #1c1d1f;
        border: 1px solid rgba(250, 247, 245, 0.10);
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 10px 30px -18px rgba(0, 0, 0, 0.9);
      }
      .eyebrow {
        font-size: 17px;
        font-weight: 500;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: #ec894c;
      }
      h1 {
        margin-top: 44px;
        font-family: "Mozilla Headline", sans-serif;
        font-weight: 700;
        font-size: 104px;
        line-height: 0.98;
        letter-spacing: -0.02em;
        color: #faf7f5;
      }
      .lede {
        margin-top: 28px;
        max-width: 720px;
        font-size: 27px;
        line-height: 1.45;
        color: rgba(250, 247, 245, 0.72);
      }
      .footer {
        display: flex;
        align-items: center;
        gap: 14px;
        font-size: 17px;
        letter-spacing: 0.06em;
        color: rgba(250, 247, 245, 0.55);
      }
      .dot { width: 5px; height: 5px; border-radius: 50%; background: #bf7245; }
      .url { margin-left: auto; color: #ec894c; }
      .mark {
        position: absolute;
        right: 60px;
        top: 128px;
        width: 300px;
        height: 300px;
        opacity: 0.14;
        filter: saturate(0);
      }
    </style>
  </head>
  <body>
    <div class="glow"></div>
    <div class="grid"></div>
    <div class="frame"></div>

    <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
      <rect width="32" height="32" rx="8.5" fill="#151320" stroke="rgba(255,255,255,0.12)" stroke-width="1" />

      <path d="M16 11.4C18.9 13.6 21 16.1 21 19.3C21 22.6 18.8 25.1 16 25.1C13.2 25.1 11 22.6 11 19.3C11 16.7 12.5 14.4 14.8 12.8L16 11.4Z" fill="#EC4899" fill-opacity="0.9" />
      <path d="M16 12.6C16.55 15.85 17.65 16.95 20.9 17.5C17.65 18.05 16.55 19.15 16 22.4C15.45 19.15 14.35 18.05 11.1 17.5C14.35 16.95 15.45 15.85 16 12.6Z" fill="#FBBF24" />
    </svg>

    <div class="card">
      <div>
        <div class="top">
          <div class="badge">
            <svg width="34" height="34" viewBox="0 0 32 32" aria-hidden="true">
              <defs>
                <linearGradient id="ogFlameMain" x1="4" y1="28" x2="28" y2="4" gradientUnits="userSpaceOnUse">
                  <stop offset="0%" stop-color="#8B5CF6" />
                  <stop offset="55%" stop-color="#C026D3" />
                  <stop offset="100%" stop-color="#EC4899" />
                </linearGradient>
                <linearGradient id="ogSpark" x1="12" y1="11" x2="20" y2="21" gradientUnits="userSpaceOnUse">
                  <stop offset="0%" stop-color="#FEF08A" />
                  <stop offset="55%" stop-color="#FBBF24" />
                  <stop offset="100%" stop-color="#F59E0B" />
                </linearGradient>
              </defs>
              <rect width="32" height="32" rx="8.5" fill="#151320" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
              <path d="M16.2 4.2C20.5 7.8 24.4 12.1 24.4 17.5C24.4 22.7 20.6 26.8 16 26.8C11.4 26.8 7.6 22.7 7.6 17.5C7.6 13.7 9.7 10.6 12.5 8.2C12.2 10.4 12.9 12.2 14.3 13.3C14 9.9 14.7 6.8 16.2 4.2Z" fill="url(#ogFlameMain)" fill-opacity="0.9" stroke="rgba(255,255,255,0.34)" stroke-width="0.7" />
              <path d="M16 11.4C18.9 13.6 21 16.1 21 19.3C21 22.6 18.8 25.1 16 25.1C13.2 25.1 11 22.6 11 19.3C11 16.7 12.5 14.4 14.8 12.8L16 11.4Z" fill="#EC4899" fill-opacity="0.75" />
              <path d="M16 12.6C16.55 15.85 17.65 16.95 20.9 17.5C17.65 18.05 16.55 19.15 16 22.4C15.45 19.15 14.35 18.05 11.1 17.5C14.35 16.95 15.45 15.85 16 12.6Z" fill="url(#ogSpark)" />
            </svg>
          </div>
          <div class="eyebrow">Offline-first habit tracker</div>
        </div>

        <h1>Daily Spark</h1>
        <p class="lede">A calm, offline-first habit tracker.<br />Show up. Tick it. Keep going.</p>
      </div>

      <div class="footer">
        <span>No account</span><span class="dot"></span>
        <span>No ads</span><span class="dot"></span>
        <span>No tracking</span>
        <span class="url">sahaya-savari.github.io/daily-spark</span>
      </div>
    </div>
  </body>
</html>
