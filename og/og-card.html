<!doctype html>
<!--
  Source document for public/og-image.png (1200x630). Not a page of the site.

  Self-contained by design: no external font, image, or stylesheet requests, so
  rendering is reproducible offline and in CI. Fonts fall back to widely
  available families (Georgia for the display face, Consolas/monospace for
  body), which keeps the layout identical across machines.

  Lives outside public/ so it is never copied into dist/ and can never be
  served. Re-render after editing:
    render this file at exactly 1200x630 and save as public/og-image.png
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Daily Spark - social card source</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { width: 1200px; height: 630px; }
      body {
        background: #121214;
        color: #faf7f5;
        font-family: "Mozilla Headline", sans-serif;
        overflow: hidden;
        position: relative;
      }
      .glow {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(720px 520px at 88% 18%, rgba(236, 137, 76, 0.20), transparent 62%),
          radial-gradient(600px 480px at 6% 96%, rgba(191, 114, 69, 0.12), transparent 60%);
      }
      .grid {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(to right, rgba(250, 247, 245, 0.045) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(250, 247, 245, 0.045) 1px, transparent 1px);
        background-size: 60px 60px;
        mask-image: radial-gradient(circle at 50% 45%, #000 10%, transparent 78%);
        -webkit-mask-image: radial-gradient(circle at 50% 45%, #000 10%, transparent 78%);
      }
      .frame {
        position: absolute;
        inset: 28px;
        border: 1px solid rgba(250, 247, 245, 0.10);
        border-radius: 28px;
      }
      .card {
        position: relative;
        height: 100%;
        padding: 72px 76px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      .top { display: flex; align-items: center; gap: 18px; }
      .badge {
        width: 64px;
        height: 64px;
        border-radius: 16px;
        background: #1c1d1f;
        border: 1px solid rgba(250, 247, 245, 0.10);
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 10px 30px -18px rgba(0, 0, 0, 0.9);
      }
      .eyebrow {
        font-size: 17px;
        font-weight: 500;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: #ec894c;
      }
      h1 {
        margin-top: 44px;
        font-family: "Mozilla Headline", sans-serif;
        font-weight: 700;
        font-size: 104px;
        line-height: 0.98;
        letter-spacing: -0.02em;
        color: #faf7f5;
      }
      .lede {
        margin-top: 28px;
        max-width: 720px;
        font-size: 27px;
        line-height: 1.45;
        color: rgba(250, 247, 245, 0.72);
      }
      .footer {
        display: flex;
        align-items: center;
        gap: 14px;
        font-size: 17px;
        letter-spacing: 0.06em;
        color: rgba(250, 247, 245, 0.55);
      }
      .dot { width: 5px; height: 5px; border-radius: 50%; background: #bf7245; }
      .url { margin-left: auto; color: #ec894c; }
      .mark {
        position: absolute;
        right: 60px;
        top: 128px;
        width: 300px;
        height: 300px;
        opacity: 0.14;
        filter: saturate(0);
      }
    </style>
  </head>
  <body>
    <div class="glow"></div>
    <div class="grid"></div>
    <div class="frame"></div>

    <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
      <rect width="32" height="32" rx="8" fill="#faf7f5" />
      <path d="M16 27c.6-4.4-.7-8.1-3.9-11.3" fill="none" stroke="#121214" stroke-width="1.7" stroke-linecap="round" />
      <path d="M12.1 15.7c-3.1-1-5.2.2-6 3.1 2.9.6 5.2-.7 6-3.1Z" fill="#121214" />
      <path d="M14.2 18.4c2.9-1.2 5.2-.3 6.3 2.6-2.8.8-5.2-.4-6.3-2.6Z" fill="#121214" />
      <path d="M16 3.2c.62 4.5 2.3 6.2 6.8 6.8-4.5.6-6.18 2.3-6.8 6.8-.62-4.5-2.3-6.2-6.8-6.8 4.5-.6 6.18-2.3 6.8-6.8Z" fill="#121214" />
      <circle cx="24.6" cy="6.4" r="1.3" fill="#121214" />
    </svg>

    <div class="card">
      <div>
        <div class="top">
          <div class="badge">
            <svg width="34" height="34" viewBox="0 0 32 32" aria-hidden="true">
              <rect width="32" height="32" rx="8" fill="#1c1d1f" />
              <path d="M16 27c.6-4.4-.7-8.1-3.9-11.3" fill="none" stroke="#bf7245" stroke-width="1.7" stroke-linecap="round" />
              <path d="M12.1 15.7c-3.1-1-5.2.2-6 3.1 2.9.6 5.2-.7 6-3.1Z" fill="#bf7245" />
              <path d="M14.2 18.4c2.9-1.2 5.2-.3 6.3 2.6-2.8.8-5.2-.4-6.3-2.6Z" fill="#bf7245" />
              <path d="M16 3.2c.62 4.5 2.3 6.2 6.8 6.8-4.5.6-6.18 2.3-6.8 6.8-.62-4.5-2.3-6.2-6.8-6.8 4.5-.6 6.18-2.3 6.8-6.8Z" fill="#ec894c" />
              <circle cx="24.6" cy="6.4" r="1.3" fill="#bf7245" />
            </svg>
          </div>
          <div class="eyebrow">Offline-first habit tracker</div>
        </div>

        <h1>Daily Spark</h1>
        <p class="lede">A calm, offline-first habit tracker.<br />Show up. Tick it. Keep going.</p>
      </div>

      <div class="footer">
        <span>No account</span><span class="dot"></span>
        <span>No ads</span><span class="dot"></span>
        <span>No tracking</span>
        <span class="url">sahaya-savari.github.io/daily-spark</span>
      </div>
    </div>
  </body>
</html>
