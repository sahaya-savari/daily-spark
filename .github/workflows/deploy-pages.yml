name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build static web app
        env:
          VITE_BASE_PATH: '/'
          VITE_SITE_ORIGIN: 'https://dailyspark.sahayasavari.dev'
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Wait for Pages artifact visibility
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in {1..10}; do
            count=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" --jq '[.artifacts[] | select(.name == "github-pages")] | length')
            if [ "$count" -eq 1 ]; then
              exit 0
            fi
            if [ "$count" -gt 1 ]; then
              echo "::error::Expected one github-pages artifact, found $count."
              exit 1
            fi
            sleep 2
          done
          echo "::error::The github-pages artifact did not become visible within 20 seconds."
          exit 1

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
