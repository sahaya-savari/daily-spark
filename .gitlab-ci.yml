# ==============================================================================
# GitLab CI/CD Configuration for Daily Spark
# Destination: https://sahaya-savari.gitlab.io/daily-spark/
#
# Publishes the static Web / PWA production build and downloadable app packages.
# ==============================================================================

stages:
  - deploy

default:
  image: node:22

cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm/

pages:
  stage: deploy
  script:
    - npm ci --cache .npm --prefer-offline
    - npm run typecheck
    - npm run build
    - rm -rf public
    - mv dist public
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
