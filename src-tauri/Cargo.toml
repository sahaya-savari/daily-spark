[package]
name = "daily-spark"
version = "1.0.2"
description = "A calm, offline-first habit and streak tracker"
authors = ["Daily Spark Team"]
edition = "2021"

[lib]
name = "daily_spark_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
